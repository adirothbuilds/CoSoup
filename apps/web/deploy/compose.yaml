services:
  web:
    image: stock-scanner-web:local
    build:
      context: ../../..
      dockerfile: apps/web/deploy/Dockerfile
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8080"]
    networks: [internal, ingress]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: "${WEB_MEMORY:-128m}"
    cpus: "${WEB_CPUS:-0.5}"
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
