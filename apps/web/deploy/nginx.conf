server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    include /etc/nginx/scanner-headers.conf;

    location = /health { access_log off; return 200 'alive'; }
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/scanner-headers.conf;
        # API query strings can contain private resource scopes. Do not log them.
        access_log off;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/scanner-headers.conf; }
}
