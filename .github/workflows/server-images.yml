name: Server and native Steve images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-images.yml'
      - 'setup.sh'
      - 'requirements.txt'
      - 'stock_scanner/**'
      - 'tests/**'
      - 'apps/server/**'
  pull_request:
    paths:
      - '.github/workflows/server-images.yml'
      - 'setup.sh'
      - 'requirements.txt'
      - 'stock_scanner/**'
      - 'tests/**'
      - 'apps/server/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system test runtime
        run: |
          sudo apt-get -o Acquire::Retries=0 update
          sudo apt-get install -y --no-install-recommends \
            python3.12-venv tesseract-ocr poppler-utils fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          /usr/bin/python3.12 -m venv .venv
          .venv/bin/python -m pip install -r apps/server/requirements.txt
          .venv/bin/python -m pip check
      - name: Scanner and deployment tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Server tests
        run: .venv/bin/python -m unittest discover -s apps/server/tests -v
      - name: Installer shell syntax
        run: bash -n setup.sh

  native-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build dedicated Codex image on its native CPU
        env:
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --platform "$IMAGE_PLATFORM" --target codex \
            -f apps/server/deploy/Dockerfile -t cosoup-codex:ci .
      - name: Verify native CLI and PostgreSQL client linkage
        env:
          IMAGE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          docker run --rm --platform "$IMAGE_PLATFORM" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env EXPECTED_ARCH="$EXPECTED_ARCH" \
            --entrypoint sh cosoup-codex:ci -ec \
            'test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
             pg_dump --version
             pg_restore --version
             bwrap --version
             codex --version'
