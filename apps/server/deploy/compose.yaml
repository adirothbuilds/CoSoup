name: stock-scanner

x-app: &app
  image: stock-scanner-server:local
  build:
    context: ../../..
    dockerfile: apps/server/deploy/Dockerfile
    target: base
  user: "${SCANNER_UID:-10001}:${SCANNER_GID:-10001}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  environment: &environment
    SCANNER_SERVER_CONFIG: /etc/stock-scanner/server.json
  tmpfs: ["/tmp:size=256m,mode=1777"]
  logging: &logging
    driver: local
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
  networks: [internal]

services:
  postgres:
    image: postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    user: "${SCANNER_UID:-10001}:${SCANNER_GID:-10001}"
    environment:
      POSTGRES_USER: scanner_admin
      POSTGRES_DB: scanner
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_database_password
    secrets: [admin_database_password]
    volumes: ["${SERVER_ROOT:?Set private SERVER_ROOT}/data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scanner_admin -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: "${POSTGRES_MEMORY:-1g}"
    cpus: "${POSTGRES_CPUS:-2}"
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: [migrate, --role-secrets-dir, /run/role-secrets]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_admin
    secrets:
      - source: admin_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/secrets:/run/role-secrets:ro"

  api:
    <<: *app
    networks: [internal, ingress]
    command: [api, --workers, "${API_WORKERS:-1}"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_api
    secrets:
      - api_token
      - source: api_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner:ro"
      - "${SERVER_ROOT}/data/uploads:/var/lib/stock-scanner/uploads"
    tmpfs: ["/tmp:size=256m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m", "/var/lib/stock-scanner/codex-profile:size=1m"]
    mem_limit: "${API_MEMORY:-512m}"
    cpus: "${API_CPUS:-1}"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  scanner-worker:
    <<: *app
    entrypoint: [python, -m, apps.server.workers.scanner]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_scanner
      MASSIVE_API_KEY_FILE: /run/secrets/massive_api_key
    secrets:
      - massive_api_key
      - source: scanner_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner"
    tmpfs: ["/tmp:size=256m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m", "/var/lib/stock-scanner/codex-profile:size=1m"]
    mem_limit: "${SCANNER_MEMORY:-4g}"
    cpus: "${SCANNER_CPUS:-2}"
    networks: [internal, egress]

  scheduler:
    <<: *app
    entrypoint: [python, -m, apps.server.workers.scheduler]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_scheduler
    secrets:
      - source: scheduler_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner:ro"
    tmpfs: ["/tmp:size=64m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m", "/var/lib/stock-scanner/codex-profile:size=1m"]
    mem_limit: "${SCHEDULER_MEMORY:-256m}"
    cpus: "${SCHEDULER_CPUS:-0.5}"

  storage-worker:
    <<: *app
    entrypoint: [python, -m, apps.server.workers.storage]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_storage
    secrets:
      - r2_access_key
      - r2_secret_key
      - archive_key
      - source: storage_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner"
    tmpfs: ["/tmp:size=256m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m", "/var/lib/stock-scanner/codex-profile:size=1m"]
    mem_limit: "${STORAGE_MEMORY:-2g}"
    cpus: "${STORAGE_CPUS:-2}"
    networks: [internal, egress]

  import-worker:
    <<: *app
    entrypoint: [python, -m, apps.server.workers.imports]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_imports
    secrets:
      - source: imports_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner"
    tmpfs: ["/tmp:size=256m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m", "/var/lib/stock-scanner/codex-profile:size=1m"]
    mem_limit: "${IMPORT_MEMORY:-2g}"
    cpus: "${IMPORT_CPUS:-2}"

  codex-worker:
    <<: *app
    profiles: [codex]
    image: stock-scanner-codex:local
    build:
      context: ../../..
      dockerfile: apps/server/deploy/Dockerfile
      target: codex
    entrypoint: [python, -m, apps.server.workers.codex]
    environment:
      <<: *environment
      SCANNER_DATABASE_USER: scanner_codex
    secrets:
      - source: codex_database_password
        target: database_password
    volumes:
      - "${SERVER_ROOT}/config/server.json:/etc/stock-scanner/server.json:ro"
      - "${SERVER_ROOT}/data:/var/lib/stock-scanner"
      - "${SERVER_ROOT}/data/codex-profile:/var/lib/codex-profile"
    tmpfs: ["/tmp:size=256m,mode=1777", "/var/lib/stock-scanner/postgres:size=1m"]
    mem_limit: "${CODEX_MEMORY:-2g}"
    cpus: "${CODEX_CPUS:-2}"
    networks: [internal, egress]

networks:
  internal: {internal: true}
  ingress: {}
  egress: {}

secrets:
  admin_database_password: {file: "${SERVER_ROOT}/secrets/admin_database_password"}
  api_database_password: {file: "${SERVER_ROOT}/secrets/api_database_password"}
  scanner_database_password: {file: "${SERVER_ROOT}/secrets/scanner_database_password"}
  scheduler_database_password: {file: "${SERVER_ROOT}/secrets/scheduler_database_password"}
  storage_database_password: {file: "${SERVER_ROOT}/secrets/storage_database_password"}
  imports_database_password: {file: "${SERVER_ROOT}/secrets/imports_database_password"}
  codex_database_password: {file: "${SERVER_ROOT}/secrets/codex_database_password"}
  api_token: {file: "${SERVER_ROOT}/secrets/api_token"}
  massive_api_key: {file: "${SERVER_ROOT}/secrets/massive_api_key"}
  r2_access_key: {file: "${SERVER_ROOT}/secrets/r2_access_key"}
  r2_secret_key: {file: "${SERVER_ROOT}/secrets/r2_secret_key"}
  archive_key: {file: "${SERVER_ROOT}/secrets/archive_key"}
